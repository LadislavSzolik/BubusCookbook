<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Cookbook</title>
<meta name="description" content="Our collection of recipes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:ital,wght@0,400;0,500;0,600;1,400&family=Londrina+Solid&display=swap" rel="stylesheet">
<style>
/* ---------- Tokens ---------- */
:root {
  --bg: #eef0f4;
  --card: #ffffff;
  --ink: #1c1b1a;
  --muted: #6b665f;
  --panel: #eeeae6;
  --line: #1c1b1a;
  --soft-line: #e3dfd9;
  --accent: #4f6b35;
  --accent-ink: #ffffff;
  --shadow: 0 1px 2px rgba(20, 20, 20, 0.04), 0 8px 30px rgba(20, 20, 20, 0.05);
  --display: "Londrina Solid", "Arial Narrow", Impact, sans-serif;
  --serif: "Crimson Pro", Georgia, "Times New Roman", serif;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #131415;
    --card: #1c1d1f;
    --ink: #efece7;
    --muted: #a39d94;
    --panel: #282623;
    --line: #efece7;
    --soft-line: #34322f;
    --accent: #9dbb7a;
    --accent-ink: #14160f;
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 8px 30px rgba(0, 0, 0, 0.25);
    color-scheme: dark;
  }
}

:root[data-theme="dark"] {
  --bg: #131415;
  --card: #1c1d1f;
  --ink: #efece7;
  --muted: #a39d94;
  --panel: #282623;
  --line: #efece7;
  --soft-line: #34322f;
  --accent: #9dbb7a;
  --accent-ink: #14160f;
  --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 8px 30px rgba(0, 0, 0, 0.25);
  color-scheme: dark;
}

/* ---------- Base ---------- */
*, *::before, *::after { box-sizing: border-box; }

html { -webkit-text-size-adjust: 100%; }

body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--serif);
  font-size: 1.125rem;
  line-height: 1.55;
  padding: 16px;
}

img { display: block; max-width: 100%; }
a { color: inherit; }
h1, h2, h3, p, ul, ol, figure { margin: 0; }
ul, ol { padding: 0; list-style: none; }

.wrap { max-width: 1100px; margin: 0 auto; }

.topnav {
  max-width: 1100px;
  margin: 0 auto 14px;
  padding: 0 4px;
  font-size: 1rem;
}
.topnav a {
  text-decoration: none;
  color: var(--muted);
  letter-spacing: 0.04em;
  text-transform: uppercase;
  font-size: 0.85rem;
}
.topnav a:hover { color: var(--ink); }

/* ---------- Recipe sheet ---------- */
.sheet {
  max-width: 1100px;
  margin: 0 auto;
  background: var(--card);
  border-radius: 36px;
  box-shadow: var(--shadow);
  padding: 44px 48px 52px;
}

.sheet-head {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 24px 40px;
  margin-bottom: 34px;
}

.sheet-head h1 {
  font-family: var(--display);
  font-weight: 400;
  font-size: clamp(2.6rem, 7vw, 4.6rem);
  line-height: 0.98;
  text-transform: uppercase;
  letter-spacing: 0.01em;
  overflow-wrap: anywhere;
}

.sub {
  margin-top: 14px;
  max-width: 38em;
  text-transform: uppercase;
  letter-spacing: 0.03em;
  font-size: 1rem;
  line-height: 1.4;
}

.meta {
  display: flex;
  flex-direction: column;
  gap: 14px;
  padding-top: 8px;
  flex: none;
}
.meta li {
  display: flex;
  align-items: center;
  gap: 12px;
  font-size: 1.25rem;
  white-space: nowrap;
}
.meta svg { width: 30px; height: 30px; flex: none; }

.hero {
  border-radius: 28px;
  overflow: hidden;
  aspect-ratio: 16 / 9;
  background: var(--panel);
  margin-bottom: 38px;
}
.hero img { width: 100%; height: 100%; object-fit: cover; }

.cols {
  display: grid;
  grid-template-columns: minmax(0, 0.8fr) minmax(0, 1.2fr);
  gap: 0;
  align-items: stretch;
}

.ingredients {
  background: var(--panel);
  border-radius: 28px;
  padding: 30px 34px 34px;
  align-self: start;
}

.ingredients h2,
.directions h2 {
  font-family: var(--serif);
  font-weight: 500;
  font-size: 2rem;
  letter-spacing: 0.02em;
  text-transform: uppercase;
  text-align: center;
  margin-bottom: 22px;
}

.ingredients h3 {
  font-size: 0.95rem;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--muted);
  margin: 20px 0 8px;
}

.ingredients li {
  padding: 5px 0;
  font-size: 1.15rem;
  line-height: 1.4;
}

.directions {
  border-left: 1.5px solid var(--line);
  margin-left: 40px;
  padding: 30px 0 0 40px;
}

.directions ol {
  counter-reset: step;
  display: grid;
  gap: 12px;
}
.directions li {
  counter-increment: step;
  display: grid;
  grid-template-columns: 1.6em 1fr;
  font-size: 1.15rem;
  line-height: 1.6;
}
.directions li::before {
  content: counter(step) ".";
  font-variant-numeric: tabular-nums;
}

.notes {
  margin-top: 40px;
  padding-top: 26px;
  border-top: 1px solid var(--soft-line);
}
.notes h2 {
  font-size: 1rem;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--muted);
  margin-bottom: 8px;
  font-weight: 500;
}
.notes p + p { margin-top: 10px; }

.credit {
  margin-top: 34px;
  font-size: 0.95rem;
  color: var(--muted);
  font-style: italic;
}

/* ---------- Listing page ---------- */
.masthead { padding: 28px 8px 10px; }
.masthead h1 {
  font-family: var(--display);
  font-weight: 400;
  text-transform: uppercase;
  font-size: clamp(3rem, 9vw, 5.6rem);
  line-height: 0.95;
}
.masthead p {
  margin-top: 12px;
  text-transform: uppercase;
  letter-spacing: 0.04em;
  font-size: 1rem;
  color: var(--muted);
}

.searchbar { margin: 26px 0 14px; }
.searchbar input {
  width: 100%;
  font: inherit;
  font-size: 1.2rem;
  color: var(--ink);
  background: var(--card);
  border: 1.5px solid var(--soft-line);
  border-radius: 999px;
  padding: 15px 24px;
  box-shadow: var(--shadow);
  outline: none;
  -webkit-appearance: none;
  appearance: none;
}
.searchbar input::placeholder { color: var(--muted); opacity: 0.8; }
.searchbar input:focus { border-color: var(--accent); }

.tags { display: flex; flex-wrap: wrap; gap: 8px; margin: 0 0 8px; }
.tags button {
  font: inherit;
  font-size: 0.95rem;
  color: var(--ink);
  background: var(--panel);
  border: 1.5px solid transparent;
  border-radius: 999px;
  padding: 4px 14px;
  cursor: pointer;
}
.tags button[aria-pressed="true"] {
  background: var(--accent);
  color: var(--accent-ink);
}
.tags button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.status {
  min-height: 1.6em;
  margin: 10px 4px 14px;
  font-size: 1rem;
  color: var(--muted);
}

.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
  gap: 22px;
}

.card {
  background: var(--card);
  border-radius: 28px;
  overflow: hidden;
  box-shadow: var(--shadow);
}
.card[hidden] { display: none; }
.card a {
  display: flex;
  flex-direction: column;
  height: 100%;
  text-decoration: none;
}
.card .thumb {
  aspect-ratio: 4 / 3;
  background: var(--panel);
  overflow: hidden;
  display: grid;
  place-items: center;
}
.card .thumb img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.4s ease; }
.card a:hover .thumb img { transform: scale(1.03); }
.card .thumb .initial {
  font-family: var(--display);
  font-size: 4.5rem;
  color: var(--muted);
  opacity: 0.55;
}
.card .body { padding: 18px 22px 22px; }
.card h2 {
  font-family: var(--display);
  font-weight: 400;
  font-size: 1.9rem;
  line-height: 1.05;
  text-transform: uppercase;
}
.card .desc {
  margin-top: 8px;
  font-size: 1rem;
  line-height: 1.4;
  color: var(--muted);
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}
.card .facts {
  margin-top: 12px;
  display: flex;
  flex-wrap: wrap;
  gap: 4px 14px;
  font-size: 0.95rem;
}
.card .chips { margin-top: 10px; display: flex; flex-wrap: wrap; gap: 6px; }
.card .chips span {
  font-size: 0.82rem;
  background: var(--panel);
  border-radius: 999px;
  padding: 1px 10px;
}

.empty {
  text-align: center;
  color: var(--muted);
  padding: 50px 10px;
}
.empty[hidden] { display: none; }

footer.site {
  max-width: 1100px;
  margin: 36px auto 8px;
  text-align: center;
  font-size: 0.9rem;
  color: var(--muted);
}

/* ---------- Small screens ---------- */
@media (max-width: 760px) {
  body { padding: 16px; font-size: 1.06rem; }
  .sheet { border-radius: 28px; padding: 26px 20px 34px; }
  .sheet-head { flex-direction: column; gap: 18px; margin-bottom: 24px; }
  .meta { flex-direction: row; flex-wrap: wrap; gap: 8px 22px; padding-top: 0; }
  .meta li { font-size: 1.1rem; }
  .meta svg { width: 26px; height: 26px; }
  .hero { aspect-ratio: 4 / 3; border-radius: 22px; margin-bottom: 26px; }
  .cols { grid-template-columns: 1fr; gap: 30px; }
  .ingredients { border-radius: 22px; padding: 24px 22px 26px; }
  .directions { border-left: 0; margin-left: 0; padding: 0; }
  .ingredients h2, .directions h2 { font-size: 1.7rem; }
}

/* ---------- Print ---------- */
@media print {
  body { background: #fff; padding: 0; color: #000; }
  .topnav, footer.site { display: none; }
  .sheet { box-shadow: none; border-radius: 0; padding: 0; background: #fff; }
  .hero { aspect-ratio: 16 / 7; }
  .ingredients { background: #f1eeea; }
}

</style>
</head>
<body>
<div class="wrap" id="listview">
  <header class="masthead">
    <h1>My Cookbook</h1>
    <p>1 recipe</p>
  </header>
  <div class="searchbar">
    <input id="q" type="search" placeholder="Search, e.g. chicken with lemon" aria-label="Search recipes" autocomplete="off" enterkeyhint="search">
  </div>
  <div id="tags" class="tags" aria-label="Filter by tag"><button type="button" data-tag="chicken" aria-pressed="false">chicken</button><button type="button" data-tag="chicken-thighs" aria-pressed="false">chicken-thighs</button><button type="button" data-tag="dinner" aria-pressed="false">dinner</button></div>
  <p id="status" class="status" role="status" aria-live="polite"></p>
  <div id="grid" class="grid">
    <article class="card" data-slug="creamy-coconut-lime-chicken"><a href="recipes/creamy-coconut-lime-chicken.html"><div class="thumb"><img src="images/creamy-coconut-lime-chicken.jpg" alt="" loading="lazy" decoding="async"></div><div class="body"><h2>Creamy Coconut Lime Chicken</h2><p class="desc">Golden-seared chicken simmered in a silky coconut sauce, finished with fresh lime and coriander.</p><div class="chips"><span>chicken</span><span>dinner</span><span>chicken-thighs</span></div></div></a></article>
  </div>
  <p id="empty" class="empty" hidden>No recipe matches that search. Try fewer words.</p>
</div>

<script type="application/json" id="recipe-data">[{"slug": "creamy-coconut-lime-chicken", "title": "Creamy Coconut Lime Chicken", "description": "Golden-seared chicken simmered in a silky coconut sauce, finished with fresh lime and coriander.", "tags": ["chicken", "dinner", "chicken-thighs"], "ingredients": ["6–8 chicken thighs, or 4–5 breasts", "Paprika", "1 large shallot", "1 green chilli", "1 tbsp minced garlic", "1 tbsp minced ginger", "200 ml chicken stock", "400 ml coconut milk", "160 ml coconut cream", "1 tbsp dark soy sauce", "1 tbsp fish sauce", "Coriander", "Lime, zest and juice", "Olive oil, 1–2 tbsp", "Salt and pepper"], "steps": ["Heat 1–2 tbsp olive oil in a large pan. Add the chicken and season with salt, pepper and paprika. Cook on both sides until golden, then remove.", "Add the shallot and chilli and cook for 3–5 minutes over low heat. Stir through the ginger, garlic and lime zest and heat for 1–2 minutes.", "Pour in the stock, coconut milk and coconut cream. Keep a little cream back to top the chicken at the end.", "Mix in the soy sauce, return the chicken to the pan, cover and cook for 10–15 minutes over low heat, until the chicken is cooked through and the sauce has thickened.", "Serve with the fish sauce, lime juice, dollops of coconut cream, coriander and lime slices."]}]</script>
<script>
/* Cookbook search: understands plain sentences such as
   "I want to make a chicken recipe which has lemon".
   Filler words are dropped, the remaining words must all match
   (title, tags, ingredients or method). Words after "without / no / not"
   are excluded. Works the same for typed or spoken text. */
(function () {
  var data = JSON.parse(document.getElementById("recipe-data").textContent);
  var input = document.getElementById("q");
  var statusEl = document.getElementById("status");
  var grid = document.getElementById("grid");
  var emptyEl = document.getElementById("empty");
  var tagBox = document.getElementById("tags");

  var STOP = new Set((
    "a an the i me my we our you your want wanna need needs would like love " +
    "to make making made cook cooking cooked prepare preparing recipe recipes " +
    "dish dishes meal something anything any some that which who whose has have " +
    "having had contains containing contain using use uses include includes " +
    "including in on of for is are be it its this please can could show find " +
    "give let lets tonight today tell about what how"
  ).split(" "));
  var NEG = new Set(["without", "no", "not", "except", "excluding", "minus"]);
  var NEG_END = new Set(["with", "and", "but", "plus", "also"]);

  function norm(s) {
    return String(s)
      .toLowerCase()
      .normalize("NFD")
      .replace(/[̀-ͯ]/g, "")
      .replace(/[^\p{L}\p{N}\s]/gu, " ");
  }
  function words(s) {
    return norm(s).split(/\s+/).filter(Boolean);
  }
  function variants(t) {
    var v = [t];
    if (t.length > 3 && t.slice(-1) === "s") v.push(t.slice(0, -1));
    if (t.length > 4 && t.slice(-2) === "es") v.push(t.slice(0, -2));
    if (t.length > 4 && t.slice(-3) === "ies") v.push(t.slice(0, -3) + "y");
    return v;
  }

  // Pre-compute searchable words per recipe, grouped by importance.
  data.forEach(function (r) {
    r._f = [
      { w: 3, words: words(r.title + " " + r.tags.join(" ")) },
      { w: 2, words: words(r.ingredients.join(" ")) },
      { w: 1, words: words(r.description + " " + r.steps.join(" ")) },
    ];
  });

  function weightFor(r, token) {
    var vs = variants(token);
    var best = 0;
    r._f.forEach(function (f) {
      if (best >= f.w) return;
      for (var i = 0; i < f.words.length; i++) {
        for (var j = 0; j < vs.length; j++) {
          if (f.words[i].indexOf(vs[j]) === 0) { best = f.w; return; }
        }
      }
    });
    return best;
  }

  function parse(text) {
    var pos = [], neg = [], negating = false;
    words(text).forEach(function (t) {
      if (NEG.has(t)) { negating = true; return; }
      if (NEG_END.has(t)) { negating = false; return; }
      if (STOP.has(t) || t.length < 2) return;
      (negating ? neg : pos).push(t);
    });
    return { pos: pos, neg: neg };
  }

  var cards = {};
  Array.prototype.forEach.call(grid.children, function (el) {
    cards[el.getAttribute("data-slug")] = el;
  });

  var activeTags = [];

  function show(list) {
    var shown = {};
    list.forEach(function (r) {
      shown[r.slug] = true;
      cards[r.slug].hidden = false;
      grid.appendChild(cards[r.slug]);
    });
    data.forEach(function (r) {
      if (!shown[r.slug]) cards[r.slug].hidden = true;
    });
    emptyEl.hidden = list.length > 0;
  }

  function byTitle(a, b) { return a.title.localeCompare(b.title); }

  function run() {
    var q = parse(input.value);
    var pool = data.filter(function (r) {
      return activeTags.every(function (t) { return r.tags.indexOf(t) !== -1; });
    });

    if (!q.pos.length && !q.neg.length) {
      show(pool.slice().sort(byTitle));
      statusEl.textContent = activeTags.length
        ? pool.length + (pool.length === 1 ? " recipe" : " recipes")
        : "";
      return;
    }

    var scored = pool.map(function (r) {
      var matched = 0, score = 0;
      q.pos.forEach(function (t) {
        var w = weightFor(r, t);
        if (w) { matched++; score += w; }
      });
      var blocked = q.neg.some(function (t) { return weightFor(r, t) > 0; });
      return { r: r, matched: matched, score: score, blocked: blocked };
    }).filter(function (s) { return !s.blocked; });

    var label = q.pos.join(" + ") + (q.neg.length ? " (without " + q.neg.join(", ") + ")" : "");
    var full = scored.filter(function (s) { return s.matched === q.pos.length; });

    if (full.length || !q.pos.length) {
      full.sort(function (a, b) { return b.score - a.score || byTitle(a.r, b.r); });
      show(full.map(function (s) { return s.r; }));
      statusEl.textContent = full.length
        ? full.length + (full.length === 1 ? " recipe" : " recipes") + " with " + label
        : "";
      return;
    }

    var partial = scored.filter(function (s) { return s.matched > 0; });
    partial.sort(function (a, b) { return b.matched - a.matched || b.score - a.score || byTitle(a.r, b.r); });
    show(partial.map(function (s) { return s.r; }));
    statusEl.textContent = partial.length
      ? "Nothing has all of " + label + ". Closest matches:"
      : "";
  }

  // Tag chips
  tagBox.addEventListener("click", function (e) {
    var b = e.target.closest("button");
    if (!b) return;
    var t = b.getAttribute("data-tag");
    var i = activeTags.indexOf(t);
    if (i === -1) activeTags.push(t); else activeTags.splice(i, 1);
    b.setAttribute("aria-pressed", i === -1 ? "true" : "false");
    run();
  });

  input.addEventListener("input", run);

  // ?q=chicken+lemon opens the page with a search already applied
  // (handy later for voice assistants or shortcuts).
  try {
    var preset = new URLSearchParams(location.search).get("q");
    if (preset) input.value = preset;
  } catch (err) { /* ignore */ }
  run();
})();

</script>
</body>
</html>
